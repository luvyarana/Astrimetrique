[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrimetrique"
version = "0.1.0"
description = "Professional macOS-native astrometric data reduction tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "astropy>=6.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "astroquery>=0.4.7",
]

[project.scripts]
astrimetrique = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
